<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" font-family="'PingFang SC','Noto Sans SC','Source Han Sans SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <title>better-code 工作流：探索、规划、构建、交付四个阶段的九个技能，doc-memory 贯穿全程；技能可按需单独调用，也可串联使用</title>
  <defs>
    <marker id="step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#287D75"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#F7F5F0"/>

  <text x="64" y="60" font-size="30" font-weight="700" fill="#24272B" font-family="'SF Mono',Consolas,monospace">better-code</text>
  <text x="64" y="94" font-size="19" fill="#5A6069">从调研到交付 · 按需调用，也可串联</text>

  <!-- 阶段一 探索 -->
  <rect x="64" y="132" width="232" height="216" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/>
  <text x="88" y="176" font-size="20" font-weight="700" fill="#1F5F58">探索</text>
  <text x="88" y="202" font-size="15" fill="#9A9EA5">先弄清问题与可选方案</text>
  <rect x="88" y="224" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="180" y="250" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">research</text>
  <rect x="88" y="276" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="180" y="302" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">spark</text>

  <!-- 阶段二 规划 -->
  <rect x="336" y="132" width="232" height="216" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/>
  <text x="360" y="176" font-size="20" font-weight="700" fill="#1F5F58">规划</text>
  <text x="360" y="202" font-size="15" fill="#9A9EA5">把边界和步骤写实</text>
  <rect x="360" y="224" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="452" y="250" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">create-plan</text>
  <rect x="360" y="276" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="452" y="302" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">plan-review</text>

  <!-- 阶段三 构建 -->
  <rect x="608" y="132" width="232" height="216" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/>
  <text x="632" y="176" font-size="20" font-weight="700" fill="#1F5F58">构建</text>
  <text x="632" y="202" font-size="15" fill="#9A9EA5">把决定落进真实调用路径</text>
  <rect x="632" y="224" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="724" y="250" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">better-code</text>
  <rect x="632" y="276" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="724" y="302" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">debug-fixer</text>

  <!-- 阶段四 交付 -->
  <rect x="880" y="132" width="232" height="216" rx="14" fill="#FFFFFF" stroke="#E4DED4" stroke-width="1.5"/>
  <text x="904" y="176" font-size="20" font-weight="700" fill="#1F5F58">交付</text>
  <text x="904" y="202" font-size="15" fill="#9A9EA5">核对结果并留下记录</text>
  <rect x="904" y="224" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="996" y="250" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">code-review</text>
  <rect x="904" y="276" width="184" height="40" rx="8" fill="#DFEDE8"/>
  <text x="996" y="302" font-size="15" fill="#24272B" text-anchor="middle" font-family="'SF Mono',Consolas,monospace">wrap</text>

  <!-- 阶段间箭头 -->
  <g stroke="#287D75" stroke-width="2" fill="none" marker-end="url(#step)">
    <path d="M296 240 H322"/>
    <path d="M568 240 H594"/>
    <path d="M840 240 H866"/>
  </g>

  <!-- 记忆横带 -->
  <rect x="64" y="392" width="1048" height="72" rx="36" fill="#DFEDE8"/>
  <text x="588" y="437" font-size="19" font-weight="600" fill="#1F5F58" text-anchor="middle">doc-memory · 全程记忆（不占阶段顺序，按需读写）</text>

  <!-- 连接线 -->
  <g stroke="#287D75" stroke-width="1.5">
    <path d="M180 348 V392"/>
    <path d="M452 348 V392"/>
    <path d="M724 348 V392"/>
    <path d="M996 348 V392"/>
  </g>
  <g fill="#F7F5F0" stroke="#287D75" stroke-width="1.5">
    <circle cx="180" cy="392" r="4"/>
    <circle cx="452" cy="392" r="4"/>
    <circle cx="724" cy="392" r="4"/>
    <circle cx="996" cy="392" r="4"/>
  </g>

  <text x="64" y="518" font-size="17" fill="#5A6069">多数改动只用到其中一两个技能；完整链路适用于新产品、跨模块改造或技术路线未定的需求。</text>
</svg>
